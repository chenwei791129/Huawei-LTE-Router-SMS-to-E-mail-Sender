[project]
name = "huawei-lte-sms-to-email"
version = "1.0.0"
description = "Forward unread SMS from a Huawei LTE router to email via Gmail SMTP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "huawei-lte-api>=1.6.10",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
# Generous limit accommodates inline gettext `.format(...)` templates.
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
