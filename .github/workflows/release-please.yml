name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  # Shared workflow: the pinned release-please SHA is maintained in
  # chenwei791129/.github for every repository.
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: chenwei791129/.github/.github/workflows/release-please.yml@main
    with:
      release-type: python
      target-branch: master
